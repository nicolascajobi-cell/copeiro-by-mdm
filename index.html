<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08090d"><title>Duelo FIFA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;font-family:Arial,sans-serif;color:white}#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}.shade{position:fixed;inset:0;background:linear-gradient(#0008,transparent 28%,transparent 63%,#000b);pointer-events:none}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:10px;right:10px;text-align:center;text-shadow:0 2px 9px #000}.title{font-size:19px;font-weight:900}.sub{font-size:11px;margin-top:3px;opacity:.85}.duel{position:fixed;top:15%;left:3vw;right:3vw;display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{min-width:0;padding:11px 6px 12px;border:2px solid #ffffffc9;border-radius:20px;background:#090b10b8;backdrop-filter:blur(10px);text-align:center;box-shadow:0 12px 35px #0006}.label{font-size:10px;font-weight:900;letter-spacing:1px;opacity:.75}.crest{width:72px;height:72px;object-fit:contain;margin:8px auto 3px;display:block;filter:drop-shadow(0 4px 7px #0008)}.team{font-size:clamp(14px,4.3vw,20px);font-weight:900;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.05}.country{font-size:10px;opacity:.75}.vs{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:3;background:#e51b23;border:2px solid white;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:0 5px 15px #0009}.controls{position:fixed;left:14px;right:14px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 10px));display:flex;flex-direction:column;align-items:center;gap:8px}.status{font-size:11px;text-shadow:0 2px 7px #000}.spin{border:0;width:min(91vw,430px);padding:17px;border-radius:999px;background:#e51b23;color:white;font-size:17px;font-weight:900;box-shadow:0 8px 26px #e51b2359}.secondary{border:0;padding:9px 14px;border-radius:999px;background:#000a;color:white;font-weight:800}.pop{animation:pop .42s ease}@keyframes pop{50%{transform:scale(1.06)}}.placeholder{opacity:.25;filter:grayscale(1)}
</style></head><body><video id="video" autoplay playsinline muted></video><div class="shade"></div><div class="top"><div class="title">⚽ DUELO FIFA</div><div class="sub">2 jogadores • 2 times diferentes • sem choro 😂</div></div><div class="duel">
<div class="card" id="c1"><div class="label">JOGADOR 1</div><img class="crest placeholder" id="i1" alt=""><div class="team" id="t1">?</div><div class="country" id="p1">TOQUE EM SORTEAR</div></div>
<div class="card" id="c2"><div class="label">JOGADOR 2</div><img class="crest placeholder" id="i2" alt=""><div class="team" id="t2">?</div><div class="country" id="p2">TOQUE EM SORTEAR</div></div></div><div class="vs">VS</div>
<div class="controls"><div class="status" id="status">Ative a câmera para começar</div><button class="spin" id="spin">🎰 SORTEAR OS DOIS</button><button class="secondary" id="camera">↻ Trocar câmera</button></div><script>
const teams=[
["Real Madrid","🇪🇸 Espanha",541],["Barcelona","🇪🇸 Espanha",529],["Atlético de Madrid","🇪🇸 Espanha",530],["Manchester City","🏴 Inglaterra",50],["Liverpool","🏴 Inglaterra",40],["Arsenal","🏴 Inglaterra",42],["Chelsea","🏴 Inglaterra",49],["Manchester United","🏴 Inglaterra",33],["Tottenham","🏴 Inglaterra",47],["Bayern de Munique","🇩🇪 Alemanha",157],["Borussia Dortmund","🇩🇪 Alemanha",165],["Bayer Leverkusen","🇩🇪 Alemanha",168],["PSG","🇫🇷 França",85],["Marseille","🇫🇷 França",81],["Monaco","🇫🇷 França",91],["Inter de Milão","🇮🇹 Itália",505],["Milan","🇮🇹 Itália",489],["Juventus","🇮🇹 Itália",496],["Napoli","🇮🇹 Itália",492],["Roma","🇮🇹 Itália",497],["Benfica","🇵🇹 Portugal",211],["Porto","🇵🇹 Portugal",212],["Sporting","🇵🇹 Portugal",228],["Ajax","🇳🇱 Holanda",194],["PSV","🇳🇱 Holanda",197],["Newcastle","🏴 Inglaterra",34],["Aston Villa","🏴 Inglaterra",66],["RB Leipzig","🇩🇪 Alemanha",173]];
const $=s=>document.querySelector(s),video=$("#video"),status=$("#status");let stream=null,facing="user",spinning=false;
const logo=id=>"https://media.api-sports.io/football/teams/"+id+".png";
function show(n,x){$("#t"+n).textContent=x[0];$("#p"+n).textContent=x[1];const im=$("#i"+n);im.src=logo(x[2]);im.classList.remove("placeholder")}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;video.style.transform=facing==="user"?"scaleX(-1)":"none";status.textContent="Câmera pronta • fiquem lado a lado"}catch(e){status.textContent="Permita o acesso à câmera no Safari"}}
$("#camera").onclick=()=>{facing=facing==="user"?"environment":"user";startCamera()};
$("#spin").onclick=()=>{if(spinning)return;spinning=true;$("#c1").classList.remove("pop");$("#c2").classList.remove("pop");status.textContent="Sorteando o duelo...";let k=0,max=35+Math.floor(Math.random()*10);const timer=setInterval(()=>{let a=Math.floor(Math.random()*teams.length),b;do b=Math.floor(Math.random()*teams.length);while(b===a);show(1,teams[a]);show(2,teams[b]);if(++k>=max){clearInterval(timer);let a=Math.floor(Math.random()*teams.length),b;do b=Math.floor(Math.random()*teams.length);while(b===a);show(1,teams[a]);show(2,teams[b]);$("#c1").classList.add("pop");$("#c2").classList.add("pop");status.textContent="🔥 DUELO DEFINIDO!";if(navigator.vibrate)navigator.vibrate([80,50,160]);spinning=false}},80)};
startCamera();
</script></body></html>
