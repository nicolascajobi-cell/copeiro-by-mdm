<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;font-family:Arial,sans-serif;color:#fff}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111;z-index:0;will-change:transform;-webkit-transform:scaleX(-1)}
.shade{position:fixed;inset:0;background:linear-gradient(#0007,transparent 25%,transparent 68%,#000a);pointer-events:none;z-index:1}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:2}
.crest{position:absolute;width:100px;height:100px;object-fit:contain;filter:drop-shadow(0 5px 8px #000a);transform:translate(-50%,-100%);opacity:0;transition:none;will-change:left,top,width,height}
.top{position:fixed;z-index:4;top:max(13px,env(safe-area-inset-top));left:10px;right:10px;text-align:center;text-shadow:0 2px 9px #000}
.title{font-size:18px;font-weight:900}.brandLogo{width:76px;height:76px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 4px;box-shadow:0 5px 18px #0009}.sub{font-size:10px;opacity:.8;margin-top:3px}
.controls{position:fixed;z-index:5;left:14px;right:14px;bottom:max(17px,calc(env(safe-area-inset-bottom) + 8px));display:flex;flex-direction:column;align-items:center;gap:7px}
.status{font-size:11px;text-shadow:0 2px 7px #000;text-align:center}.spin{border:0;width:min(91vw,430px);padding:16px;border-radius:999px;background:#e51b23;color:#fff;font-size:17px;font-weight:900;box-shadow:0 8px 26px #e51b2359}
.secondary{border:0;padding:8px 13px;border-radius:999px;background:#000a;color:#fff;font-weight:800}.credit{font-size:10px;opacity:.72;text-shadow:0 2px 7px #000}.actions{display:none;gap:7px;flex-wrap:wrap;justify-content:center}.action{border:1px solid #ffffff55;padding:9px 12px;border-radius:999px;background:#000c;color:#fff;font-weight:900;font-size:11px}.boom{animation:boom .65s cubic-bezier(.2,.9,.25,1.2)}@keyframes boom{0%{transform:translate(-50%,-100%) scale(.15);filter:drop-shadow(0 0 0 #fff)}45%{transform:translate(-50%,-100%) scale(1.8);filter:drop-shadow(0 0 22px #fff)}100%{transform:translate(-50%,-100%) scale(1)}}.tier{position:absolute;transform:translate(-50%,0);padding:5px 10px;border-radius:999px;background:#000c;border:1px solid #ffffff80;font-size:11px;font-weight:900;text-shadow:0 2px 6px #000;opacity:0;white-space:nowrap;transition:opacity .2s}
.penalty{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000b;pointer-events:auto}.penalty.show{display:flex}.pitch{position:relative;width:min(88vw,390px);height:330px;border-radius:22px;background:linear-gradient(#157b39,#0e5f2b);border:2px solid #ffffff88;overflow:hidden;box-shadow:0 18px 50px #000}.penTitle{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 7px #000}.goal{position:absolute;left:50%;top:82px;transform:translateX(-50%);width:72%;height:120px;border:6px solid #fff;border-bottom:0;background:repeating-linear-gradient(90deg,#ffffff22 0 2px,transparent 2px 24px),repeating-linear-gradient(0deg,#ffffff22 0 2px,transparent 2px 24px)}.keeper{position:absolute;left:50%;top:135px;transform:translateX(-50%);font-size:52px;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.ball{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-size:42px;transition:left .8s ease-in,top .8s ease-in,bottom .8s ease-in,transform .8s ease-in}.penResult{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 7px #000;opacity:0;transition:opacity .2s}.penalty.kick .ball{bottom:auto;top:130px}.penalty.goalshot .ball{left:72%;transform:translateX(-50%) scale(.72)}.penalty.goalshot .keeper{transform:translateX(-120px) rotate(-18deg)}.penalty.save .ball{left:50%;transform:translateX(-50%) scale(.72)}.penalty.save .keeper{transform:translateX(-50%) scale(1.12)}.penalty.done .penResult{opacity:1}
</style>
</head>

const fortes=new Set(["Tottenham","Newcastle","Aston Villa","RB Leipzig","Benfica","Sporting","Porto","Marseille","Monaco","Galatasaray","Al Hilal"]);
const intermediarios=new Set(["Lazio","Lyon","Sevilla","PSV","Ajax","Roma","Al Nassr","Al Ittihad"]);
function tierOf(t){if(elite.has(t[0]))return "🔥 ELITE";if(muitoFortes.has(t[0]))return "💥 MUITO FORTE";if(fortes.has(t[0]))return "⚡ FORTE";if(intermediarios.has(t[0]))return "⚽ INTERMEDIÁRIO";return "☠️ AZARÃO"}
let audioCtx=null;function soundFor(t){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),tier=tierOf(t);o.connect(g);g.connect(audioCtx.destination);o.type=tier.includes("ELITE")?"sawtooth":tier.includes("MUITO")?"square":"sine";o.frequency.setValueAtTime(tier.includes("ELITE")?880:tier.includes("MUITO")?660:tier.includes("FORTE")?520:380,audioCtx.currentTime);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.55);o.start();o.stop(audioCtx.currentTime+.55)}catch(e){}}
function reveal(){crests.forEach((c,i)=>{c.classList.remove("boom");void c.offsetWidth;c.classList.add("boom");soundFor(assigned[i])});setTimeout(()=>crests.forEach(c=>c.classList.remove("boom")),700)}
async function initDetector(){
 try{
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
  detector=await FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite",delegate:"CPU"},runningMode:"VIDEO",minDetectionConfidence:.5});
  status.textContent="Detector pronto • fiquem lado a lado"; startLoop();
 }catch(e){console.error(e);status.textContent="Não consegui carregar o rastreamento. Atualize a página."}
}
async function startCamera(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();video.style.transform=facing==="user"?"scaleX(-1)":"none";video.style.webkitTransform=facing==="user"?"scaleX(-1)":"none";
  if(detector) status.textContent="Câmera pronta • fiquem lado a lado";
 }catch(e){status.textContent="Permita o acesso à câmera no Safari"}
}
function screenBox(b){
 const vw=innerWidth,vh=innerHeight,iw=video.videoWidth,ih=video.videoHeight;if(!iw||!ih)return null;
 const scale=Math.max(vw/iw,vh/ih),dw=iw*scale,dh=ih*scale,ox=(vw-dw)/2,oy=(vh-dh)/2;
 let x=ox+(b.originX+b.width/2)*scale;if(facing==="user")x=vw-x;
 return {x,y:oy+b.originY*scale,w:b.width*scale};
}
function updateTrack(i,p){
 const c=crests[i],tag=tiers[i];if(!p){c.style.opacity=0;tag.style.opacity=0;smooth[i]=null;return}
 if(!smooth[i])smooth[i]={x:p.x,y:p.y,w:p.w};else{smooth[i].x+=(p.x-smooth[i].x)*.58;smooth[i].y+=(p.y-smooth[i].y)*.58;smooth[i].w+=(p.w-smooth[i].w)*.58}
 const q=smooth[i],size=Math.max(64,Math.min(125,q.w*.72));c.style.width=size+"px";c.style.height=size+"px";c.style.left=q.x+"px";c.style.top=(q.y-8)+"px";c.style.opacity=assigned[i]?1:0;tag.style.left=q.x+"px";tag.style.top=(q.y+8)+"px";
}
function startLoop(){if(running)return;running=true;const loop=()=>{if(detector&&video.readyState>=2&&video.currentTime!==lastTime){lastTime=video.currentTime;try{const r=detector.detectForVideo(video,performance.now());let boxes=(r.detections||[]).map(d=>screenBox(d.boundingBox)).filter(Boolean).sort((a,b)=>a.x-b.x).slice(0,2);updateTrack(0,boxes[0]||null);updateTrack(1,boxes[1]||null)}catch(e){}}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function show(i,t){assigned[i]=t;crests[i].src=logo(t[2]);crests[i].style.opacity=1}
$("#camera").onclick=()=>{facing=facing==="user"?"environment":"user";smooth=[null,null];startCamera()};
$("#spin").onclick=()=>{if(spinning)return;spinning=true;status.textContent="Sorteando...";let k=0,max=30+Math.floor(Math.random()*8);const timer=setInterval(()=>{let a=Math.floor(Math.random()*teams.length),b;do b=Math.floor(Math.random()*teams.length);while(b===a);show(0,teams[a]);show(1,teams[b]);if(++k>=max){clearInterval(timer);let a=Math.floor(Math.random()*teams.length),b;do b=Math.floor(Math.random()*teams.length);while(b===a);show(0,teams[a]);show(1,teams[b]);reveal();stealUsed=false;$("#actions").style.display="flex";tiers[0].textContent=tierOf(assigned[0]);tiers[1].textContent=tierOf(assigned[1]);tiers[0].style.opacity=1;tiers[1].style.opacity=1;setTimeout(()=>{tiers[0].style.opacity=0;tiers[1].style.opacity=0},1800);status.textContent="🔥 DUELO DEFINIDO!";if(navigator.vibrate)navigator.vibrate([80,50,160]);spinning=false}},75)};
$("#steal").onclick=()=>{if(stealUsed||!assigned[0]||!assigned[1])return;stealUsed=true;$("#steal").disabled=true;const won=Math.random()<.5,p=$("#penalty"),pr=$("#penResult");p.className="penalty show";pr.textContent="";status.textContent="⚽ Pênalti do roubo...";setTimeout(()=>{p.classList.add("kick",won?"goalshot":"save")},650);setTimeout(()=>{if(won){pr.textContent="⚽ GOOOOOL! ROUBOU O TIME!";[assigned[0],assigned[1]]=[assigned[1],assigned[0]];crests[0].src=logo(assigned[0][2]);crests[1].src=logo(assigned[1][2]);status.textContent="😱 ROUBO BEM-SUCEDIDO! TIMES TROCADOS!";if(navigator.vibrate)navigator.vibrate([70,40,70,40,180])}else{pr.textContent="🧤 DEFENDEU! ROUBO FALHOU!";status.textContent="😂 DEFENDEU! OS TIMES CONTINUAM IGUAIS";if(navigator.vibrate)navigator.vibrate(120)}p.classList.add("done")},1500);setTimeout(()=>{p.className="penalty";if(won)reveal()},2850)};
$("#spin").addEventListener("click",()=>{$("#steal").disabled=false});
$("#photo").onclick=async()=>{try{const canvas=document.createElement("canvas");canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;const ctx=canvas.getContext("2d");if(facing==="user"){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.setTransform(1,0,0,1,0,0);const imgs=await Promise.all(assigned.map(async t=>{if(!t)return null;const im=new Image();im.crossOrigin="anonymous";im.src=logo(t[2]);await im.decode();return im}));const scaleX=canvas.width/innerWidth,scaleY=canvas.height/innerHeight;for(let i=0;i<2;i++){if(!imgs[i]||!smooth[i])continue;const q=smooth[i],size=Math.max(90,Math.min(190,q.w*.9))*scaleX;ctx.drawImage(imgs[i],q.x*scaleX-size/2,(q.y-110)*scaleY,size,size)}canvas.toBlob(async blob=>{const file=new File([blob],"duelo-fifa-v2.jpg",{type:"image/jpeg"});if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:"Duelo FIFA V2"});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="duelo-fifa-v2.jpg";a.click()}}, "image/jpeg",.92)}catch(e){status.textContent="Não foi possível gerar a foto neste navegador"}};
await startCamera();await initDetector();
</script></body></html>
