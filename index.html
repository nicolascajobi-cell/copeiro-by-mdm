<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b10"><title>Sorteio FIFA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;font-family:Arial,sans-serif;color:#fff}#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}.shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 30%,transparent 65%,rgba(0,0,0,.6));pointer-events:none}.top{position:fixed;top:max(18px,env(safe-area-inset-top));left:16px;right:16px;text-align:center}.title{font-weight:900;font-size:20px;text-shadow:0 2px 10px #000}.sub{font-size:12px;opacity:.85;margin-top:4px}.card{position:fixed;top:18%;left:50%;transform:translateX(-50%);width:min(84vw,390px);padding:19px;border:2px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(8,10,15,.68);backdrop-filter:blur(12px);text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.35)}.label{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.8}.team{font-size:clamp(25px,8vw,44px);font-weight:900;margin-top:9px;min-height:55px;display:flex;align-items:center;justify-content:center}.country{font-size:14px;opacity:.8}.controls{position:fixed;left:18px;right:18px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));display:flex;flex-direction:column;gap:10px;align-items:center}button{border:0;color:#fff;font-weight:900;cursor:pointer}.spin{width:min(86vw,420px);padding:18px 22px;border-radius:999px;font-size:18px;background:#e51b23;box-shadow:0 8px 28px rgba(229,27,35,.4)}.secondary{padding:10px 15px;border-radius:999px;background:rgba(0,0,0,.58)}.status{font-size:12px;text-shadow:0 2px 6px #000}.flash{animation:pop .42s ease}@keyframes pop{0%{transform:translateX(-50%) scale(.9)}70%{transform:translateX(-50%) scale(1.05)}100%{transform:translateX(-50%) scale(1)}}
</style></head><body>
<video id="video" autoplay playsinline muted></video><div class="shade"></div>
<div class="top"><div class="title">⚽ SORTEIO FIFA</div><div class="sub">O time que cair é o seu. Sem choro 😂</div></div>
<div class="card" id="card"><div class="label">SEU TIME É</div><div class="team" id="team">TOQUE EM SORTEAR</div><div class="country" id="country">🎮</div></div>
<div class="controls"><div class="status" id="status">Ative a câmera para começar</div><button class="spin" id="spin">🎰 SORTEAR TIME</button><button class="secondary" id="camera">↻ Trocar câmera</button></div>
<script>
const teams=[["Real Madrid","🇪🇸 Espanha"],["Barcelona","🇪🇸 Espanha"],["Atlético de Madrid","🇪🇸 Espanha"],["Manchester City","🏴 Inglaterra"],["Liverpool","🏴 Inglaterra"],["Arsenal","🏴 Inglaterra"],["Chelsea","🏴 Inglaterra"],["Manchester United","🏴 Inglaterra"],["Tottenham","🏴 Inglaterra"],["Bayern de Munique","🇩🇪 Alemanha"],["Borussia Dortmund","🇩🇪 Alemanha"],["Bayer Leverkusen","🇩🇪 Alemanha"],["PSG","🇫🇷 França"],["Marseille","🇫🇷 França"],["Monaco","🇫🇷 França"],["Inter de Milão","🇮🇹 Itália"],["Milan","🇮🇹 Itália"],["Juventus","🇮🇹 Itália"],["Napoli","🇮🇹 Itália"],["Roma","🇮🇹 Itália"],["Benfica","🇵🇹 Portugal"],["Porto","🇵🇹 Portugal"],["Sporting","🇵🇹 Portugal"],["Ajax","🇳🇱 Holanda"],["PSV","🇳🇱 Holanda"],["Newcastle","🏴 Inglaterra"],["Aston Villa","🏴 Inglaterra"],["RB Leipzig","🇩🇪 Alemanha"]];
const video=document.querySelector("#video"),team=document.querySelector("#team"),country=document.querySelector("#country"),status=document.querySelector("#status"),card=document.querySelector("#card");let stream=null,facing="user",spinning=false;
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;status.textContent="Câmera pronta • toque em SORTEAR";video.style.transform=facing==="user"?"scaleX(-1)":"none"}catch(e){status.textContent="Permita o acesso à câmera no navegador"}}
document.querySelector("#camera").onclick=()=>{facing=facing==="user"?"environment":"user";startCamera()};
document.querySelector("#spin").onclick=()=>{if(spinning)return;spinning=true;card.classList.remove("flash");status.textContent="Sorteando...";let ticks=0,max=38+Math.floor(Math.random()*10);const timer=setInterval(()=>{const t=teams[Math.floor(Math.random()*teams.length)];team.textContent=t[0];country.textContent=t[1];ticks++;if(ticks>=max){clearInterval(timer);const r=teams[Math.floor(Math.random()*teams.length)];team.textContent=r[0];country.textContent=r[1];card.classList.add("flash");status.textContent="Fechou! Esse é o seu time 😈";if(navigator.vibrate)navigator.vibrate([80,40,160]);spinning=false}},85)};
startCamera();
</script></body></html>
